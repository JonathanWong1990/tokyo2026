<!doctype html>
<html lang="zh-Hant" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)">
<title>東京聖誕之旅 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a small travel app — bottom tab bar, list screens, and a page per place. Ryokan palette: stone, sumi ink, bronze. */
:root {
  --bg: #F2F0EB;
  --surface: #FBFAF7;
  --ink: #2A2723;
  --muted: #6E675D;
  --line: #E2DDD3;
  --bronze: #6B5C43;
  --bronze-soft: #EAE4D8;
  --pass: #2E2A25;
  --pass-fg: #F2F0EB;
  --pass-muted: #B5AA97;
  --moss: #4F6141;
  --moss-soft: #E3E8DC;
  --ochre: #7A5414;
  --ochre-soft: #F3E9D6;
  --shade: rgba(42, 39, 35, .05);

  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-latin: "Cormorant Garamond", "Times New Roman", serif;

  --s-xs: 0.875rem;
  --s-sm: 0.9375rem;
  --s-md: 1.0625rem;
  --s-lg: 1.3125rem;
  --s-xl: 1.875rem;
  --tabs-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191714; --surface: #23201C; --ink: #ECE7DE; --muted: #A79F92; --line: #36322C;
    --bronze: #C7B18A; --bronze-soft: #2F2A22; --pass: #0F0E0C; --pass-fg: #ECE7DE; --pass-muted: #9C9282;
    --moss: #A6BA92; --moss-soft: #262C20; --ochre: #DDAE62; --ochre-soft: #33281A; --shade: rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191714; --surface: #23201C; --ink: #ECE7DE; --muted: #A79F92; --line: #36322C;
  --bronze: #C7B18A; --bronze-soft: #2F2A22; --pass: #0F0E0C; --pass-fg: #ECE7DE; --pass-muted: #9C9282;
  --moss: #A6BA92; --moss-soft: #262C20; --ochre: #DDAE62; --ochre-soft: #33281A; --shade: rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: var(--s-md); line-height: 1.65;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 12px);
}
body.locked { overflow: hidden; }
[data-lang="zh"] .en, [data-lang="en"] .zh { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 34rem; margin: 0 auto; padding-inline: 18px; }
img { max-width: 100%; display: block; }

/* Top bar */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.top.scrolled { border-bottom-color: var(--line); }
.top.show-title .top-title { opacity: 1; }
.top .wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-height: 56px; }
.back {
  display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; cursor: pointer;
  padding: 8px 10px 8px 0; min-height: 44px; font-size: var(--s-sm); font-weight: 500; color: var(--bronze);
}
.back svg { width: 20px; height: 20px; }
.top-title { opacity: 0; transition: opacity .2s; font-family: var(--f-display); font-size: 1.0625rem; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.lang button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; font-size: var(--s-sm); font-weight: 500; color: var(--muted); cursor: pointer; min-height: 44px; min-width: 44px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .row { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabs-h); }
.tabs a {
  display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none;
  color: var(--muted); font-size: 0.8125rem; font-weight: 500;
}
.tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"] svg { stroke: var(--bronze); stroke-width: 2; }

/* Common */
.view { padding-block: 8px 24px; }
.eyebrow { font-family: var(--f-latin); font-style: italic; font-size: 1.0625rem; color: var(--bronze); letter-spacing: .03em; }
h1 { font-family: var(--f-display); font-weight: 300; font-size: var(--s-xl); letter-spacing: .08em; line-height: 1.3; margin: 6px 0 6px; text-wrap: balance; }
.meta { color: var(--muted); font-size: var(--s-sm); letter-spacing: .02em; }
.lede { color: var(--muted); font-size: var(--s-sm); margin: 0 0 14px; }
.sec { margin-top: 26px; }
.sec-title { font-family: var(--f-display); font-weight: 400; font-size: var(--s-lg); letter-spacing: .06em; margin: 0 0 10px; }
.card { background: var(--surface); border-radius: 18px; box-shadow: 0 1px 2px var(--shade); }
.wip {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  font-size: var(--s-xs); font-weight: 500; letter-spacing: .04em; color: var(--ochre);
  background: var(--ochre-soft); padding: 4px 12px; border-radius: 999px;
}
.wip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.changes { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--bronze-soft); font-size: var(--s-sm); line-height: 1.6; }
.changes .lbl { display: block; font-size: var(--s-xs); color: var(--bronze); font-weight: 500; letter-spacing: .04em; margin-bottom: 2px; }
.badge { display: inline-block; font-size: 0.8125rem; font-weight: 500; padding: 1px 8px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.badge.b-booked { color: var(--moss); background: var(--moss-soft); }
.badge.b-tobook, .badge.b-idea { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.badge.b-first { color: var(--bg); background: var(--bronze); }
.badge.b-review { color: var(--ochre); background: var(--ochre-soft); }
.pick { font-size: 0.8125rem; font-weight: 500; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pick.suggested { background: var(--ink); color: var(--bg); }
.pick.either { background: var(--bronze-soft); color: var(--bronze); }
.pick.alt { box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.walk { display: inline-flex; gap: 3px; vertical-align: middle; }
.walk i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.walk i.on { background: var(--bronze); }
.facts-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: var(--s-xs); color: var(--muted); }
.facts-row > span { display: inline-flex; align-items: center; gap: 6px; }
.facts-row .badge { margin-left: 0; }
.flag { border-radius: 14px; padding: 11px 14px; font-size: var(--s-sm); line-height: 1.6; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.flag .k { font-size: var(--s-xs); font-weight: 700; letter-spacing: .04em; padding-top: 2px; white-space: nowrap; }
.flag.tbd { background: var(--ochre-soft); }
.flag.tbd .k { color: var(--ochre); }
.flag.note { background: var(--bronze-soft); }
.flag.note .k { color: var(--bronze); }
.chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex: none; }

/* Link rows (a place, a restaurant, a hotel) */
.rows { padding: 2px 14px; }
.lrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; text-decoration: none; min-height: 60px; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow .th { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: var(--bronze-soft); }
.lrow .th.ph { display: grid; place-items: center; }
.lrow .th.ph svg { width: 24px; height: 24px; stroke: var(--bronze); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lrow .t { font-size: var(--s-xs); color: var(--bronze); font-weight: 500; width: 3.4em; }
.lrow .w { min-width: 0; line-height: 1.45; }
.lrow .w b { font-weight: 500; }
.lrow .w small { display: block; color: var(--muted); font-size: var(--s-xs); margin-top: 2px; }
.lrow .w .price { display: block; font-size: var(--s-xs); margin-top: 1px; }
.lrow.slim { grid-template-columns: 1fr auto; }
.lrow.timed { grid-template-columns: auto auto 1fr auto; }

/* Route choices and split days */
.fork { display: grid; gap: 10px; padding: 14px; border-radius: 18px; box-shadow: inset 0 0 0 1.5px var(--line); }
.fork-head { font-size: var(--s-xs); font-weight: 700; letter-spacing: .06em; color: var(--bronze); }
.fork-opt { display: grid; gap: 8px; }
.fork-lbl { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 1.0625rem; letter-spacing: .04em; }
.fork-n { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-body); font-size: 0.8125rem; font-weight: 700; flex: none; }
.fork-or { display: flex; align-items: center; gap: 10px; font-size: var(--s-xs); color: var(--muted); }
.fork-or::before, .fork-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.fork .stack { gap: 8px; }

/* Boarding-pass legs */
.pass {
  background: var(--pass); color: var(--pass-fg); border-radius: 18px; padding: 14px 18px;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
  box-shadow: inset 0 0 0 1px var(--line);
}
.pass .st { min-width: 0; }
.pass .st b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.125rem; letter-spacing: .04em; line-height: 1.35; overflow-wrap: anywhere; }
.pass .st:last-child { text-align: right; }
.pass .mid { text-align: center; font-size: 0.8125rem; color: var(--pass-muted); line-height: 1.4; max-width: 10em; }
.pass .mid b { display: block; font-family: var(--f-latin); font-size: 1.25rem; font-weight: 500; color: var(--pass-fg); white-space: nowrap; }
.pass .lab { font-size: 0.8125rem; letter-spacing: .1em; color: var(--pass-muted); }
.stack { display: grid; gap: 10px; }

/* Home */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: block; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; text-decoration: none; background: var(--pass); }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile > span {
  position: absolute; inset: auto 0 0 0; padding: 28px 12px 10px; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.65)); font-family: var(--f-display); font-size: 1.125rem; letter-spacing: .08em;
}
.tile > span small { display: block; font-family: var(--f-body); font-size: 0.8125rem; letter-spacing: 0; opacity: .85; }
.today-card { display: grid; gap: 4px; padding: 16px; text-decoration: none; border: 1.5px solid var(--bronze); }
.today-card .lbl { font-size: var(--s-xs); color: var(--bronze); font-weight: 700; letter-spacing: .06em; }
.today-card b { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.today-card .nts { font-size: var(--s-xs); color: var(--ochre); }
.todo-list { padding: 4px 14px; }
.todo-list a { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; text-decoration: none; }
.todo-list a + a { border-top: 1px solid var(--line); }
.todo-list .code { font-family: var(--f-latin); font-size: 1.5rem; color: var(--bronze); line-height: 1; text-align: center; }
.todo-list .tx { font-size: var(--s-sm); line-height: 1.55; min-width: 0; }
.factlist { list-style: none; margin: 0; padding: 4px 16px; }
.factlist li { padding: 12px 0; line-height: 1.55; }
.factlist li + li { border-top: 1px solid var(--line); }
.factlist b { display: block; font-weight: 500; }
.factlist span { font-size: var(--s-sm); color: var(--muted); }

/* Days */
.daylist { padding: 2px 14px; }
.daylist a { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; text-decoration: none; min-height: 52px; }
.daylist a + a { border-top: 1px solid var(--line); }
.daylist .dn { text-align: center; line-height: 1.1; }
.daylist .dn b { display: block; font-family: var(--f-latin); font-weight: 500; font-size: 1.5rem; color: var(--bronze); }
.daylist .dn small { font-size: 0.75rem; color: var(--muted); }
.daylist .tx { font-size: var(--s-sm); line-height: 1.5; min-width: 0; }
.daylist a.is-today { background: var(--bronze-soft); margin-inline: -14px; padding-inline: 14px; }
.who { display: inline-block; font-size: 0.8125rem; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.who-all { color: var(--moss); background: var(--moss-soft); }
.who-split { color: var(--ochre); background: var(--ochre-soft); }
.who-jv { color: var(--bronze); background: var(--bronze-soft); }
.day-cards { display: grid; gap: 10px; }
.dcard { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; text-decoration: none; }
.dcard .dd { text-align: center; line-height: 1.1; align-self: start; padding-top: 2px; }
.dcard .dd b { display: block; font-family: var(--f-latin); font-weight: 500; font-size: 1.9rem; color: var(--bronze); }
.dcard .dd small { font-size: 0.8125rem; color: var(--muted); }
.dcard .w { min-width: 0; display: grid; gap: 4px; justify-items: start; line-height: 1.45; }
.dcard .w b { font-family: var(--f-display); font-weight: 500; font-size: 1.0625rem; }
.dcard .w small { color: var(--muted); font-size: var(--s-xs); }
.dcard .th { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.dcard.is-today { box-shadow: inset 0 0 0 1.5px var(--bronze); }
.daynav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.daynav .btn { grid-auto-flow: column; gap: 6px; min-height: 52px; font-size: var(--s-xs); }

/* Plan list */
.group-lbl { margin: 24px 2px 10px; font-size: var(--s-xs); letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 12px; }
.group-lbl::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.plan-cards { display: grid; gap: 14px; }
.pcard { display: block; text-decoration: none; overflow: hidden; }
.pcard .img { position: relative; aspect-ratio: 16 / 9; background: var(--bronze-soft); }
.pcard .img img { width: 100%; height: 100%; object-fit: cover; }
.pcard .code {
  position: absolute; left: 12px; bottom: 10px; width: 48px; height: 48px; border-radius: 12px;
  background: var(--surface); color: var(--bronze); display: grid; place-items: center;
  font-family: var(--f-latin); font-size: 2rem; line-height: 1;
}
.pcard .body { padding: 12px 16px 14px; display: grid; gap: 6px; }
.pcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.1875rem; letter-spacing: .04em; margin: 0; line-height: 1.4; text-wrap: balance; }
.pcard .stops { font-size: var(--s-xs); color: var(--muted); line-height: 1.5; }

/* Hero (plan + place pages) */
.hero { margin: 4px -18px 0; position: relative; }
.hero img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; max-height: 62vh; }
.hero .code {
  position: absolute; left: 18px; bottom: -22px; width: 56px; height: 56px; border-radius: 14px;
  background: var(--surface); color: var(--bronze); display: grid; place-items: center; box-shadow: 0 2px 8px var(--shade);
  font-family: var(--f-latin); font-size: 2.3rem; line-height: 1;
}
.credit { font-size: 0.75rem; color: var(--muted); padding: 6px 0 0; text-align: right; }
.credit a { color: inherit; display: inline-block; padding-block: 12px; margin-block: -12px; }
.hero + .credit { padding-right: 0; }
.title-block { margin-top: 18px; display: grid; gap: 6px; }
.title-block h1 { font-size: 1.625rem; font-weight: 400; margin: 0; }
.title-block .ja { font-size: var(--s-sm); color: var(--muted); }
.has-code .title-block { margin-top: 30px; }
.prose { margin: 14px 0 0; font-size: var(--s-md); line-height: 1.75; }
.blist { margin: 0; padding: 4px 16px; list-style: none; }
.blist li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 9px 0; line-height: 1.6; }
.blist li + li { border-top: 1px solid var(--line); }
.blist li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bronze); margin-top: .7em; }
.blist.tips li::before { border-radius: 1px; transform: rotate(45deg); background: var(--ochre); }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 18px; }
.btn {
  display: grid; place-items: center; gap: 2px; padding: 12px 8px; min-height: 64px; border: 0; border-radius: 16px; cursor: pointer;
  text-decoration: none; background: var(--bronze-soft); color: var(--ink); font-weight: 500; font-size: var(--s-sm); text-align: center;
}
.btn svg { width: 22px; height: 22px; stroke: var(--bronze); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary svg { stroke: var(--bg); }
.kv { display: grid; gap: 2px; padding: 12px 16px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv small { font-size: var(--s-xs); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 44px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; font-size: var(--s-sm); }
.chip b { font-family: var(--f-latin); font-size: 1.125rem; color: var(--bronze); font-weight: 500; }

/* Calendar */
.period { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 18px 2px 8px; }
.period b { font-family: var(--f-display); font-weight: 400; letter-spacing: .06em; }
.period span { font-size: var(--s-xs); color: var(--muted); }
.cal { list-style: none; margin: 0; padding: 0 16px; }
.cal li { display: grid; grid-template-columns: 50px 1fr; gap: 14px; padding: 12px 0; align-items: start; }
.cal li + li { border-top: 1px solid var(--line); }
.cal .dt { text-align: center; line-height: 1.15; padding-top: 2px; }
.cal .dt b { display: block; font-family: var(--f-latin); font-weight: 500; font-size: 1.6rem; color: var(--bronze); }
.cal .dt small { font-size: 0.8125rem; color: var(--muted); }
.cal .what { min-width: 0; line-height: 1.5; }
.cal .what > b { font-weight: 500; }
.cal .open { color: var(--muted); }
.cal .what a { text-decoration: none; }
.cal .what a b { border-bottom: 1px solid var(--bronze); font-weight: 500; }
.cal .nts { display: grid; gap: 2px; margin-top: 3px; }
.cal .nts span { font-size: var(--s-xs); color: var(--ochre); }
.cal li.today { background: var(--bronze-soft); margin-inline: -16px; padding-inline: 16px; }
.cal li.today .dt b { color: var(--ink); }
.today-tag { display: inline-block; margin-top: 4px; font-size: 0.8125rem; font-weight: 700; color: var(--bg); background: var(--bronze); padding: 0 8px; border-radius: 6px; }

/* Hotels */
.hcard { display: block; text-decoration: none; overflow: hidden; }
.hcard .body { padding: 14px 16px; display: grid; gap: 4px; }
.hcard b { font-family: var(--f-display); font-weight: 500; font-size: 1.125rem; }
.hcard small { color: var(--bronze); font-size: var(--s-xs); }
.hcard p { margin: 4px 0 0; font-size: var(--s-sm); color: var(--muted); line-height: 1.6; }
.hcard .more-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: var(--s-xs); color: var(--bronze); font-weight: 500; }

/* Food */
.food-group { display: grid; gap: 8px; margin-bottom: 22px; }
.food-group h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.125rem; letter-spacing: .05em; margin: 0 2px; }
.food-group .intro { margin: -2px 2px 2px; font-size: var(--s-xs); color: var(--muted); }
.empty-slot { border: 1.5px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; color: var(--muted); font-size: var(--s-sm); }
.plan-tag { font-family: var(--f-latin); font-size: 1rem; color: var(--bronze); }
.more { background: var(--surface); border-radius: 18px; box-shadow: 0 1px 2px var(--shade); }
.more summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  padding: 14px 16px; min-height: 52px; font-weight: 500;
}
.more summary::-webkit-details-marker { display: none; }
.more summary .cnt { font-size: var(--s-xs); color: var(--muted); font-weight: 400; }
.more summary::after { content: ""; width: 8px; height: 8px; border-right: 1.5px solid var(--bronze); border-bottom: 1.5px solid var(--bronze); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .15s; }
.more[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.more .rows { border-top: 1px solid var(--line); }

/* Credits */
.credits { list-style: none; margin: 0; padding: 4px 16px; font-size: var(--s-xs); color: var(--muted); }
.credits li { padding: 8px 0; }
.credits li + li { border-top: 1px solid var(--line); }
.credits b { color: var(--ink); font-weight: 500; }

footer { padding-block: 28px 8px; color: var(--muted); font-size: var(--s-xs); text-align: center; line-height: 1.8; }
footer a { color: var(--bronze); display: inline-block; padding-block: 12px; }

/* Taxi card */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(20,18,15,.5); display: grid; align-items: end; }
.sheet {
  background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 22px calc(26px + env(safe-area-inset-bottom, 0px));
  max-width: 34rem; width: 100%; margin: 0 auto; display: grid; gap: 14px; text-align: center;
}
.sheet .hint { font-size: var(--s-xs); color: var(--muted); letter-spacing: .06em; }
.sheet .ja { font-family: "Hiragino Mincho ProN", "Yu Mincho", var(--f-display); font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1.35; font-weight: 500; overflow-wrap: anywhere; }
.sheet .please { font-size: var(--s-lg); }
.sheet .please small { display: block; font-size: var(--s-xs); color: var(--muted); }
.sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.sheet .sbtn { border: 0; border-radius: 14px; padding: 14px; font-weight: 500; cursor: pointer; text-decoration: none; text-align: center; background: var(--bronze-soft); }
.sheet .sbtn.primary { background: var(--ink); color: var(--bg); }

@media (max-width: 420px) {
  .fork { padding: 10px; margin-inline: -4px; }
  .fork .rows { padding-inline: 10px; }
}
@media (max-width: 380px) {
  .lrow .th { width: 52px; height: 52px; }
  .pass .st b { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <span id="back-slot"></span>
    <span class="top-title" id="top-title"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btn-zh" data-set="zh" aria-pressed="true">中</button>
      <button type="button" id="btn-en" data-set="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="wrap view" id="view"></main>

<nav class="tabs" aria-label="Main">
  <div class="row" id="tabs"></div>
</nav>

<div class="sheet-bg" id="taxi" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="taxi-ja">
    <div class="hint"><span class="zh">請向司機出示此畫面</span><span class="en">Show this to the driver</span></div>
    <div class="ja" id="taxi-ja" lang="ja"></div>
    <div class="please"><span lang="ja">ここまでお願いします。</span><small lang="zh-Hant"><span class="zh">（請帶我們到這裡）</span><span class="en">(Please take us here.)</span></small></div>
    <div class="row">
      <a class="sbtn" id="taxi-map" href="#" target="_blank" rel="noopener"><span class="zh">開啟地圖</span><span class="en">Open map</span></a>
      <button class="sbtn primary" type="button" id="taxi-close"><span class="zh">關閉</span><span class="en">Close</span></button>
    </div>
  </div>
</div>

<script src="trip-data.js"></script>
<script src="place-info.js"></script>
<script src="place-img.js"></script>
<script>
(function () {
  var T = window.TRIP, INFO = window.PLACE_INFO || {}, IMG = window.PLACE_IMG || {};
  var root = document.documentElement, view = document.getElementById('view');
  var WEEK_ZH = ['日','一','二','三','四','五','六'], WEEK_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var PICK = { suggested: { zh: '建議', en: 'Suggested' }, either: { zh: '二選一', en: 'Pick one' }, alt: { zh: '後備', en: 'Backup' } };
  var STATUS = {
    booked: { zh: '已訂', en: 'Booked' }, first: { zh: '優先考慮', en: 'Top pick' }, idea: { zh: '候選', en: 'Option' },
    review: { zh: '保留？', en: 'Keep?' }, tobook: { zh: '未訂', en: 'Not booked' }
  };
  var ICON = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    plans: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',
    days: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    hotels: '<path d="M3 19V7M3 13h18v6M21 19v-4a3 3 0 0 0-3-3h-7v1"/><circle cx="7.5" cy="10" r="1.8"/>',
    food: '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    chev: '<path d="M9 5l7 7-7 7"/>',
    taxi: '<path d="M5 16V11l2-4h10l2 4v5"/><path d="M3 16h18v2H3zM9 4h6"/><circle cx="7.5" cy="13" r=".8"/><circle cx="16.5" cy="13" r=".8"/>',
    map: '<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
    web: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 2.5 14.5 0 17M12 3.5c-2.5 2.5-2.5 14.5 0 17"/>',
    photo: '<rect x="3.5" y="6" width="17" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.2-2h3.6L15 6"/>'
  };
  function svg(name, cls) { return '<svg viewBox="0 0 24 24" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + ICON[name] + '</svg>'; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function bi(o) {
    if (o == null) return '';
    if (typeof o === 'string') return esc(o);
    return '<span class="zh">' + esc(o.zh) + '</span><span class="en">' + esc(o.en) + '</span>';
  }
  function mapUrl(p) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.q || p.en); }
  function parse(s) { return new Date(s + 'T00:00:00'); }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function dur(d) {
    var m = /^(~?)([\d.]+(?:[–-][\d.]+)?)\s*(min|h)$/.exec(String(d).trim());
    if (!m) return { zh: d, en: d };
    return { zh: (m[1] ? '約 ' : '') + m[2] + (m[3] === 'h' ? ' 小時' : ' 分鐘'), en: m[1] + m[2] + (m[3] === 'h' ? ' h' : ' min') };
  }
  function badge(st) { return st && STATUS[st] ? '<span class="badge b-' + st + '">' + bi(STATUS[st]) + '</span>' : ''; }
  function walkBar(n) {
    return '<span><span class="zh">步行量</span><span class="en">Walking</span> <span class="walk" role="img" aria-label="' + n + '/3">' +
      [1, 2, 3].map(function (k) { return '<i class="' + (k <= n ? 'on' : '') + '"></i>'; }).join('') + '</span></span>';
  }
  function hoursOf(x) {
    return typeof x.hours === 'string'
      ? '<span><span class="zh">' + esc(x.hours) + ' 小時</span><span class="en">' + esc(x.hours) + ' hours</span></span>'
      : '<span>' + bi(x.hours) + '</span>';
  }

  // ---------- Indexes ----------
  var ideaByCode = {}; T.ideas.forEach(function (x) { ideaByCode[x.code] = x; });
  var foodRows = [];   // every restaurant row with its group
  T.food.forEach(function (g) {
    (g.items || []).forEach(function (r) { foodRows.push({ r: r, plan: r.plan }); });
    (g.sub || []).forEach(function (sg) { sg.items.forEach(function (r) { foodRows.push({ r: r, plan: r.plan || sg.plan, area: sg.title }); }); });
  });
  var foodById = {}; foodRows.forEach(function (f) { foodById[f.r.place] = f; });
  var hotelById = {}; (T.hotels || []).forEach(function (h) { hotelById[h.place] = h; });
  // All place rows in a plan, including those inside route choices
  function flat(items) {
    var out = [];
    items.forEach(function (it) {
      if (it.type === 'branches') it.options.forEach(function (o) { out = out.concat(flat(o.items)); });
      else out.push(it);
    });
    return out;
  }
  function plansWith(id) { return T.ideas.filter(function (x) { return flat(x.items).some(function (it) { return it.place === id; }); }); }
  function planImage(x) {
    var f = flat(x.items);
    for (var i = 0; i < f.length; i++) { var p = f[i].place; if (p && IMG[p]) return IMG[p]; }
    return null;
  }
  // "淺草寺 → 隅田川 → 晴空塔 / 上野 → 淺草寺" for plan cards
  function stopLine(items, lang) {
    var parts = [], seen = {};
    items.forEach(function (it) {
      if (it.type === 'branches') {
        parts.push(it.options.map(function (o) { return stopLine(o.items, lang); }).join(it.mode === 'split' ? ' ｜ ' : ' / '));
      } else if (it.place && !seen[it.place]) { seen[it.place] = 1; parts.push(esc(T.places[it.place][lang])); }
    });
    return parts.join(' → ');
  }

  var now = new Date(); now.setHours(0, 0, 0, 0);
  var todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  var inTrip = todayStr >= T.start && todayStr <= T.end;
  var tbc = T.datesConfirmed ? '' : '?';

  // ---------- Pieces ----------
  function thumb(id, fallback) {
    var im = IMG[id];
    return im ? '<img class="th" src="' + esc(im.src) + '" alt="" loading="lazy">'
      : '<span class="th ph" aria-hidden="true">' + svg(foodById[id] ? 'food' : hotelById[id] ? 'hotels' : 'map') + '</span>';
  }
  function placeRow(it) {
    var p = T.places[it.place];
    var inner = '<span class="w"><b>' + (p ? bi(p) : bi(it.name)) + '</b>' + badge(it.status) + (it.optional ? '<span class="badge b-idea"><span class="zh">可選</span><span class="en">Optional</span></span>' : '') + (it.sub ? '<small>' + bi(it.sub) + '</small>' : '') + '</span>';
    var t = it.time ? '<span class="t">' + bi(it.time) + '</span>' : '';
    if (!p) return '<div class="lrow slim' + (t ? ' timed' : '') + '" style="grid-template-columns:' + (t ? 'auto 1fr' : '1fr') + '">' + t + inner + '</div>';
    return '<a class="lrow' + (t ? ' timed' : '') + '" href="#/place/' + esc(it.place) + '">' + t + thumb(it.place) + inner + svg('chev', 'chev') + '</a>';
  }
  function foodRow(r) {
    var p = T.places[r.place];
    return '<a class="lrow slim" href="#/place/' + esc(r.place) + '"><span class="w"><b>' + bi(p) + '</b>' + badge(r.status) +
      '<small>' + bi(r.kind) + '</small>' + (r.price ? '<span class="price">' + bi(r.price) + '</span>' : '') +
      '</span>' + svg('chev', 'chev') + '</a>';
  }
  function renderItems(items) {
    var out = '', buf = [];
    function flush() { if (buf.length) { out += '<div class="card rows">' + buf.join('') + '</div>'; buf = []; } }
    items.forEach(function (it) {
      if (it.type === 'leg') {
        flush();
        out += '<div class="pass"><div class="st"><span class="lab">' + bi({ zh: '由', en: 'FROM' }) + '</span><b>' + bi(it.from) + '</b></div>' +
          '<div class="mid"><b>' + bi(dur(it.dur)) + '</b>' + bi(it.via) + '</div>' +
          '<div class="st"><span class="lab">' + bi({ zh: '到', en: 'TO' }) + '</span><b>' + bi(it.to) + '</b></div></div>';
      } else if (it.type === 'branches') {
        flush();
        var split = it.mode === 'split';
        out += '<div class="fork"><div class="fork-head">' + (it.head ? bi(it.head) : split
            ? '<span class="zh">分頭行動</span><span class="en">Split up</span>'
            : '<span class="zh">選擇一條路線</span><span class="en">Pick one route</span>') + '</div>' +
          it.options.map(function (o, k) {
            return (k && !split ? '<div class="fork-or"><span class="zh">或</span><span class="en">or</span></div>' : '') +
              '<div class="fork-opt"><div class="fork-lbl">' + (split ? '' : '<span class="fork-n">' + (k + 1) + '</span>') + bi(o.label) + '</div>' + renderItems(o.items) + '</div>';
          }).join('') + '</div>';
      } else if (it.type === 'tbd' || it.type === 'note') {
        flush();
        var k = it.type === 'tbd' ? '<span class="zh">未決定</span><span class="en">Undecided</span>' : '<span class="zh">留意</span><span class="en">Note</span>';
        out += '<div class="flag ' + it.type + '"><span class="k">' + k + '</span><span>' + bi(it.text) + '</span></div>';
      } else {
        buf.push(placeRow(it));
      }
    });
    flush();
    return '<div class="stack">' + out + '</div>';
  }
  function credit(im) {
    return im ? '<div class="credit"><span class="zh">相片</span><span class="en">Photo</span>: <a href="' + esc(im.page) + '" target="_blank" rel="noopener">' + esc(im.by) + '</a> · ' + esc(im.lic) + '</div>' : '';
  }

  // ---------- Day helpers ----------
  var WHO = {
    all: { zh: '四人', en: 'All four' },
    split: { zh: '分開', en: 'Splitting up' },
    jv: { zh: 'John・Vanjai', en: 'John & Vanjai' }
  };
  function dayIndex(date) { return T.calendar.map(function (c) { return c.date; }).indexOf(date); }
  function dayImage(c) {
    var f = flat(c.items || []);
    for (var i = 0; i < f.length; i++) { var p = f[i].place; if (p && IMG[p]) return IMG[p]; }
    return c.plan && ideaByCode[c.plan] ? planImage(ideaByCode[c.plan]) : null;
  }
  function dateLabel(c) {
    var d = parse(c.date);
    return { zh: '第 ' + (dayIndex(c.date) + 1) + ' 日 · ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日（週' + WEEK_ZH[d.getDay()] + '）',
             en: 'Day ' + (dayIndex(c.date) + 1) + ' · ' + WEEK_EN[d.getDay()] + ' ' + d.getDate() + ' Dec' };
  }
  function daysWith(id) { return T.calendar.filter(function (c) { return flat(c.items || []).some(function (it) { return it.place === id; }); }); }
  function dayChip(c) { var d = parse(c.date); return '<a class="chip" href="#/day/' + c.date + '"><b>' + d.getDate() + '</b><span class="zh">12月 · 週' + WEEK_ZH[d.getDay()] + '</span><span class="en">' + WEEK_EN[d.getDay()] + '</span></a>'; }
  function whoTag(c) { return c.who && WHO[c.who] ? '<span class="who who-' + c.who + '">' + bi(WHO[c.who]) + '</span>' : ''; }

  // ---------- Screens ----------
  var screens = {};

  screens.home = function () {
    var s = parse(T.start), e = parse(T.end), nights = Math.round((e - s) / 864e5);
    var today = '';
    if (inTrip) {
      var c = T.calendar.filter(function (x) { return x.date === todayStr; })[0];
      var tn = c && c.notes ? c.notes.map(function (n) { return bi(n); }).join(' · ') : '';
      today = '<a class="card today-card" href="' + (c ? '#/day/' + c.date : '#/days') + '"><span class="lbl"><span class="zh">今日 · ' + md(now) + '</span><span class="en">TODAY · ' + md(now) + '</span></span>' +
        '<b>' + (c && c.title ? bi(c.title) : bi({ zh: '自由活動', en: 'Free time' })) + '</b>' +
        (tn ? '<span class="nts">' + tn + '</span>' : '') + '</a>';
    }
    var h = '<div class="eyebrow">Tokyo · December 2026</div>' +
      '<h1><span class="zh">東京聖誕之旅</span><span class="en">Tokyo at Christmas</span></h1>' +
      '<div class="meta"><span class="zh">' + md(s) + '–' + md(e) + (T.datesConfirmed ? '' : '（暫定）') + ' · ' + esc(T.people.zh) + '</span>' +
      '<span class="en">' + md(s) + '–' + md(e) + (T.datesConfirmed ? '' : ' (draft)') + ' · ' + esc(T.people.en) + '</span></div>';
    if (today) h += '<div class="sec" style="margin-top:16px">' + today + '</div>';
    else h += (T.status ? '<div class="wip">' + bi(T.status) + '</div>' : '') +
      '<div class="changes"><span class="lbl"><span class="zh">本次更新 · 第 ' + T.version + ' 版 · ' + esc(T.updated) + '</span><span class="en">What\'s new · v' + T.version + ' · ' + esc(T.updated) + '</span></span>' + bi(T.changes) + '</div>';

    // Day list at a glance
    h += '<div class="sec"><h2 class="sec-title"><span class="zh">每日一覽</span><span class="en">Day by day</span></h2><div class="card daylist">' +
      T.calendar.map(function (c) {
        var d = parse(c.date);
        return '<a href="#/day/' + c.date + '"' + (c.date === todayStr ? ' class="is-today"' : '') + '><span class="dn"><b>' + d.getDate() + '</b><small><span class="zh">週' + WEEK_ZH[d.getDay()] + '</span><span class="en">' + WEEK_EN[d.getDay()] + '</span></small></span>' +
          '<span class="tx">' + bi(c.title) + (c.who && c.who !== 'all' ? ' ' + whoTag(c) : '') + '</span>' + svg('chev', 'chev') + '</a>';
      }).join('') + '</div></div>';

    var img = function (id) { return IMG[id] ? '<img src="' + esc(IMG[id].src) + '" alt="" loading="lazy">' : ''; };
    h += '<div class="sec tiles">' +
      '<a class="tile" href="#/days">' + img('kawaguchiko') + '<span><span class="zh">每日行程</span><span class="en">Daily plan</span><small>' + md(s) + '–' + md(e) + '</small></span></a>' +
      '<a class="tile" href="#/plans">' + img('skytree') + '<span><span class="zh">其他選擇</span><span class="en">Other options</span><small><span class="zh">' + T.ideas.length + ' 個</span><span class="en">' + T.ideas.length + ' ideas</span></small></span></a>' +
      '<a class="tile" href="#/hotels">' + img('hibiya') + '<span><span class="zh">酒店</span><span class="en">Hotels</span><small><span class="zh">' + (T.hotels || []).length + ' 間</span><span class="en">' + (T.hotels || []).length + ' hotels</span></small></span></a>' +
      '<a class="tile" href="#/food">' + img('tsukiji') + '<span><span class="zh">餐廳</span><span class="en">Food</span><small><span class="zh">' + foodRows.length + ' 間</span><span class="en">' + foodRows.length + ' places</span></small></span></a>' +
      '</div>';

    var open = [];
    T.calendar.forEach(function (c) { (c.items || []).forEach(function (it) { if (it.type === 'tbd') open.push({ c: c, text: it.text }); }); });
    if (open.length) {
      h += '<div class="sec"><h2 class="sec-title"><span class="zh">尚待決定</span><span class="en">Still to decide</span></h2>' +
        '<div class="card todo-list">' + open.map(function (o) {
          return '<a href="#/day/' + o.c.date + '"><span class="code">' + parse(o.c.date).getDate() + '</span><span class="tx">' + bi(o.text) + '</span>' + svg('chev', 'chev') + '</a>';
        }).join('') + '</div></div>';
    }
    h += '<div class="sec"><h2 class="sec-title"><span class="zh">留意</span><span class="en">Good to know</span></h2><ul class="card factlist">' +
      (T.facts || []).map(function (f) { return '<li><b>' + bi(f.title) + '</b><span>' + bi(f.text) + '</span></li>'; }).join('') + '</ul></div>';
    h += '<footer><span class="zh">第 ' + T.version + ' 版</span><span class="en">Version ' + T.version + '</span> · <a href="#/credits"><span class="zh">相片來源</span><span class="en">Photo credits</span></a></footer>';
    return { title: null, html: h };
  };

  screens.days = function () {
    function periodOf(date) {
      for (var i = 0; i < (T.periods || []).length; i++) { var p = T.periods[i]; if (date >= p.from && date <= p.to) return p; }
      return null;

  document.addEventListener('click', function (ev) { var b = ev.target.closest('[data-taxi]'); if (b) openTaxi(b.dataset.taxi, b); });
  document.getElementById('taxi-close').addEventListener('click', closeTaxi);
  taxi.addEventListener('click', function (ev) { if (ev.target === taxi) closeTaxi(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !taxi.hidden) closeTaxi(); });

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  navStack = [location.hash || '#/'];
  render(false);
})();
</script>
</body>
</html>
